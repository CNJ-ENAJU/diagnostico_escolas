name: Deploy Painel GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências Node
        run: npm install --no-audit --no-fund

      - name: Gerar camada pública de dados
        run: |
          if [ -d "../04_Relatorio" ]; then
            npm run data
          else
            echo "Camada pública pré-compilada utilizada no ambiente CI do GitHub Actions."
          fi

      - name: Executar testes de dados e privacidade
        run: npm run test


      - name: Validar consistência entre UI e indicadores homologados
        run: python scripts/validate_ui_consistency.py

      - name: Validar fonte da Rede Nacional antes do build
        run: |
          grep -q "Mapa interativo das unidades por UF" src/components/BrazilMap.tsx
          grep -q "network-modal" src/components/BrazilMap.tsx
          grep -q "UF da sede institucional proxy" src/pages/NationalNetwork.tsx

      - name: Compilar front-end (Vite)
        run: npm run build

      - name: Validar artefato compilado da Rede Nacional
        run: |
          grep -R -q "Mapa interativo das unidades por UF" dist/assets
          grep -R -q "Detalhamento territorial" dist/assets
          grep -R -q "Filtrar painel por" dist/assets

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
